# On a version tag (v1.2.3): build the npm tarball, the Python sdist and
# wheels (Linux x86_64/aarch64, macOS arm64/x86_64), and attach them to a
# GitHub release. Publishing to npm and PyPI is off until the repository
# variable PUBLISH_PACKAGES is set to "true" (see docs/INSTALL.md).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  EMSCRIPTEN_VERSION: 6.0.10

jobs:
  versions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag, package.json, pyproject.toml and __init__.py agree
        run: |
          npm_v=$(node -p "require('./packages/npm/package.json').version")
          py_v=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          init_v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' python/dense_late_ann/__init__.py)
          echo "npm $npm_v, pyproject $py_v, __init__ $init_v, ref $GITHUB_REF_NAME"
          test "$npm_v" = "$py_v" && test "$py_v" = "$init_v"
          case "$GITHUB_REF" in refs/tags/v*) test "${GITHUB_REF_NAME#v}" = "$npm_v" ;; esac

  npm:
    needs: versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: emsdk-cache
      - name: Build the WebAssembly targets
        run: |
          make sqlite
          make -j"$(nproc)" wasm
      - name: Pack
        run: |
          mkdir -p dist
          cd packages/npm && npm pack --pack-destination ../../dist
      - uses: actions/upload-artifact@v4
        with:
          name: npm
          path: dist/*.tgz

  sdist:
    needs: versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sdist (includes the pinned SQLite headers)
        run: |
          make sqlite
          pip install build
          python -m build --sdist --outdir dist .
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    needs: sdist
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: sdist
      - name: Locate the sdist
        id: sdist
        shell: bash
        run: echo "path=$(ls sdist/*.tar.gz)" >> "$GITHUB_OUTPUT"
      - uses: pypa/cibuildwheel@v2.23
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
          output-dir: wheelhouse
        env:
          # The extensions do not use the Python ABI (py3-none wheels), so one
          # interpreter per platform is enough.
          CIBW_BUILD: "cp312-manylinux_* cp312-macosx_*"
          CIBW_TEST_REQUIRES: apsw
          CIBW_TEST_COMMAND: dense-late-ann check
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  github-release:
    needs: [npm, sdist, wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish-pypi:
    needs: github-release
    if: vars.PUBLISH_PACKAGES == 'true'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing; no token secret needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: rm -f dist/*.tgz
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    needs: github-release
    if: vars.PUBLISH_PACKAGES == 'true'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write   # npm provenance
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm
          path: dist
      - run: npm publish --provenance --access public dist/*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
